<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reservAR - Bienvenido a tu momento</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter', sans-serif;}</style>
</head>
<body class="bg-black text-white min-h-screen">
  <div class="p-6 max-w-5xl mx-auto">
    <h1 class="text-4xl font-extrabold">Bienvenido a tu momento</h1>
    <p class="text-gray-400 mt-2">Reservá en tu barbería, gym o centro de estética favorito en segundos.</p>
    
    <div class="mt-6 bg-zinc-900 rounded-2xl p-4 flex gap-2">
      <input id="buscador" placeholder="Buscar barbería, local..." class="flex-1 bg-zinc-800 rounded-xl px-4 py-3 outline-none">
      <button onclick="buscar()" class="bg-white text-black px-6 rounded-xl font-bold">Buscar</button>
    </div>

    <div id="locales" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-8">
      <p class="text-gray-500">Cargando locales...</p>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC57wshaJ2EuIBoBdXv18opL4u_Vuw2bAQ",
  authDomain: "reservar-cb70d.firebaseapp.com",
  projectId: "reservar-cb70d",
  storageBucket: "reservar-cb70d.firebasestorage.app",
  messagingSenderId: "630908928696",
  appId: "1:630908928696:web:5e89f5f2b1cc2b240e6a4d",
  measurementId: "G-2HMNZ69E4G"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function cargarLocales(filtro=""){
  const cont = document.getElementById("locales");
  const querySnapshot = await getDocs(collection(db, "locales"));
  cont.innerHTML = "";
  querySnapshot.forEach((doc) => {
    const data = doc.data();
    if(filtro && !data.nombre?.toLowerCase().includes(filtro.toLowerCase())) return;
    cont.innerHTML += `
      <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800">
        <h3 class="font-bold text-lg">${data.nombre || 'Local'}</h3>
        <p class="text-sm text-gray-400 mt-1">${data.direccion || 'Dirección no disponible'}</p>
        <button class="mt-4 w-full bg-white text-black py-2.5 rounded-xl font-bold">Reservar</button>
      </div>
    `;
  });
  if(cont.innerHTML === "") cont.innerHTML = "<p class='text-gray-500'>No se encontraron locales. Cargalos desde el Panel Local o Admi.</p>";
}
window.buscar = () => {
  const val = document.getElementById("buscador").value;
  cargarLocales(val);
}
cargarLocales();
</script>
</body>
</html>
