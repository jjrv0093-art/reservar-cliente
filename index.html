<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mas Ventas - Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
font-family:'Manrope',sans-serif;
background:#f8f7ff;
color:#1e293b;
padding-bottom:90px;
}
.header{
position:sticky;
top:0;
z-index:10;
background:rgba(255,255,255,.96);
backdrop-filter:blur(10px);
border-bottom:1px solid #ede9fe;
padding:14px;
}
.logo{
font-weight:800;
font-size:22px;
letter-spacing:-.5px;
color:#3a0f6e;
}
.logo span{
color:#6a11cb;
}
.search-box{
display:flex;
gap:8px;
margin-top:12px;
}
.search-box input{
flex:1;
padding:12px 16px;
border-radius:999px;
border:1px solid #ddd6fe;
background:#fff;
outline:none;
}
.search-box button{
padding:12px 18px;
border-radius:999px;
border:none;
background:linear-gradient(135deg,#6a11cb,#7b1fa2);
color:#fff;
font-weight:700;
}
<style>
.fav-btn{
position:fixed;
top:14px;
right:14px;
z-index:20;
background:#fff;
border:1px solid #ede9fe;
border-radius:999px;
padding:8px 14px;
font-weight:800;
box-shadow:0 4px 12px rgba(106,17,203,.15);
}
.cats{
display:flex;
gap:8px;
overflow-x:auto;
padding:14px 14px 0;
scrollbar-width:none;
}
.cats::-webkit-scrollbar{
display:none;
}
.cat{
white-space:nowrap;
padding:8px 16px;
border-radius:999px;
border:1px solid #ede9fe;
background:#fff;
font-weight:700;
font-size:13px;
color:#3a0f6e;
}
.cat.active{
background:linear-gradient(135deg,#6a11cb,#7b1fa2);
color:#fff;
border-color:#6a11cb;
}
.grid{
padding:14px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
.card{
background:#fff;
border-radius:18px;
overflow:hidden;
border:1px solid #ede9fe;
position:relative;
}
.card img{
width:100%;
aspect-ratio:4/3;
object-fit:cover;
background:#f5f3ff;
}
.card-body{
padding:10px;
}
.card-title{
font-weight:700;
font-size:13px;
line-height:1.2;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
min-height:32px;
}
.card-price{
font-weight:800;
margin-top:6px;
color:#6a11cb;
}
.heart{
position:absolute;
top:8px;
right:8px;
background:rgba(255,255,255,.9);
border:none;
width:32px;
height:32px;
border-radius:50%;
font-size:16px;
}
.modal{
position:fixed;
inset:0;
z-index:50;
background:rgba(58,15,110,.4);
display:none;
padding:18px;
}
.modal.open{
display:flex;
align-items:flex-end;
}
.sheet{
background:#fff;
width:100%;
border-radius:24px 24px 0 0;
max-height:85vh;
overflow:auto;
padding:18px;
}
.empty{
padding:40px 20px;
text-align:center;
color:#7c3aed;
}
</style>
</head>
<body>
<button class="fav-btn" onclick="openFav()">
❤ <span id="favCount">0</span>
</button>
<div class="header">
<div class="logo">
MAS <span>VENTAS</span>
</div>
<div class="search-box">
<input id="q" placeholder="Buscar en catálogo o Álbum..." oninput="render()">
<button onclick="render()">
Buscar
</button>
</div>
</div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="modal" id="favModal" onclick="if(event.target==this)closeFav()">
<div class="sheet">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h3 style="font-weight:800;color:#3a0f6e">
Favoritos
</h3>
<button onclick="closeFav()" style="border:none;background:#f5f3ff;width:32px;height:32px;border-radius:50%">
✕
</button>
</div>
<div id="favList"></div>
</div>
</div>
<script>
const ADMIN_KEY='admin_catalog_v2';
const FAV_KEY='cliente_favs_v6';
const uidLocal=localStorage.getItem('uidLocal')||'local_'+Date.now();
localStorage.setItem('uidLocal',uidLocal);

function getCatalog(){
try{
let raw=localStorage.getItem(ADMIN_KEY);
if(!raw) return [];
return JSON.parse(raw);
}catch(e){
return [];
}
}
function getFavs(){
try{
return JSON.parse(localStorage.getItem(FAV_KEY)||'[]');
}catch(e){
return [];
}
}
function saveFavs(f){
localStorage.setItem(FAV_KEY,JSON.stringify(f));
}
function getCats(){
let cats=new Set(['Todos','Álbum']);
getCatalog().forEach(p=>{
if(p.categoria) cats.add(p.categoria);
});
return Array.from(cats);
}
let activeCat='Todos';
function renderCats(){
let box=document.getElementById('cats');
let html='';
getCats().forEach(c=>{
html+=`<button class="cat ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`;
});
box.innerHTML=html;
}
function setCat(c){
activeCat=c;
renderCats();
render();
}
function openFav(){
let favs=getFavs();
let catalog=getCatalog();
let list=document.getElementById('favList');
if(favs.length===0){
list.innerHTML=`<div class="empty">Aún no tenés favoritos</div>`;
}else{
let html='';
favs.forEach(id=>{
let p=catalog.find(x=>x.id===id);
if(!p) return;
html+=`
<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ede9fe">
<img src="${p.imagen}" style="width:56px;height:56px;border-radius:12px;object-fit:cover">
<div style="flex:1">
<div style="font-weight:700;font-size:13px">${p.nombre}</div>
<div style="font-weight:800;color:#6a11cb">$${p.precio}</div>
</div>
<button onclick="toggleFav('${p.id}')" style="border:none;background:#f5f3ff;width:32px;height:32px;border-radius:50%">✕</button>
</div>
`;
});
list.innerHTML=html;
}
document.getElementById('favModal').classList.add('open');
}
function closeFav(){
document.getElementById('favModal').classList.remove('open');
}
<script>
function toggleFav(id){
let favs=getFavs();
if(favs.includes(id)){
favs=favs.filter(x=>x!==id);
}else{
favs.push(id);
let p=getCatalog().find(x=>x.id===id);
let datosReservaCompleto={
idReserva:'res_'+Date.now(),
uidLocal:uidLocal,
fecha:new Date().toISOString(),
producto:p,
clienteData:{
uid:uidLocal,
origen:'cliente_fav'
}
};
let reservas=JSON.parse(localStorage.getItem('reservas_para_admi')||'[]');
reservas.push(datosReservaCompleto);
localStorage.setItem('reservas_para_admi',JSON.stringify(reservas));
}
saveFavs(favs);
render();
renderFavCount();
if(document.getElementById('favModal').classList.contains('open')){
openFav();
}
}
function renderFavCount(){
document.getElementById('favCount').textContent=getFavs().length;
}
function render(){
let q=document.getElementById('q').value.toLowerCase();
let catalog=getCatalog();
let favs=getFavs();
let filtered=catalog.filter(p=>{
let matchQ=!q||p.nombre.toLowerCase().includes(q);
let matchCat=activeCat==='Todos'||p.categoria===activeCat;
return matchQ&&matchCat;
});
let grid=document.getElementById('grid');
if(filtered.length===0){
grid.innerHTML=`<div class="empty" style="grid-column:1/-1">No hay productos en ${activeCat}</div>`;
return;
}
let html='';
filtered.forEach(p=>{
let isFav=favs.includes(p.id);
html+=`
<div class="card">
<button class="heart" onclick="toggleFav('${p.id}')">
${isFav?'❤':'♡'}
</button>
<img src="${p.imagen}" loading="lazy">
<div class="card-body">
<div class="card-title">${p.nombre}</div>
<div class="card-price">$${p.precio}</div>
</div>
</div>
`;
});
grid.innerHTML=html;
}
renderCats();
render();
renderFavCount();
</script>
</body>
</html>
