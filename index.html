function checkBloqueo(l){
if(l.planActivo===false){
return 'Este local está vencido';
}
if(l.visible===false){
return 'Local pausado';
}
if(l.reservasPausadas===true){
return 'Pausó reservas';
}
if(l.planVence){
try{
let v=l.planVence.toDate?l.planVence.toDate():new Date(l.planVence.seconds?l.planVence.seconds*1000:l.planVence);
if(v<Date.now()){
return 'Plan vencido';
}
}catch(e){}
}
return null;
}

  <script>
async function cargarLocales(){
let sel=$('rLocal');
sel.innerHTML='<option>Cargando...</option>';
let snap=await db.collection('config').get();
localesCache=[];
snap.forEach(doc=>{
if(['global','cobros','planes','adm','branding'].includes(doc.id)){
return;
}
localesCache.push({
id:doc.id,
...doc.data()
});
});
localesCache=localesCache.filter(l=>!checkBloqueo(l));
$('destacados').innerHTML=localesCache.map(l=>{
let foto=l.foto||`https://picsum.photos/seed/${l.id}/200`;
return `<div data-nombre="${(l.localNombre||'').toLowerCase()}" style="display:flex;gap:10px;background:#ffffff10;border:1px solid #ffffff18;border-radius:14px;padding:8px;margin-bottom:8px;cursor:pointer" onclick="document.getElementById('rLocal').value='${l.id}';document.getElementById('rLocal').dispatchEvent(new Event('change'))"><img src="${foto}" style="width:68px;height:68px;border-radius:10px;object-fit:cover"><div><b>${l.localNombre||'Local'}</b><div style="font-size:11px;opacity:.7">${l.direccion||''}</div></div></div>`;
}).join('');
sel.innerHTML='';
let selSop=$('soporteLocal');
selSop.innerHTML='<option value="">Elegí local</option>';
localesCache.forEach(l=>{
let o=document.createElement('option');
o.value=l.id;
o.textContent=l.localNombre||'Local';
sel.appendChild(o);
let o2=o.cloneNode(true);
selSop.appendChild(o2);
});
if(sel.options.length){
sel.selectedIndex=0;
onLocalChange();
}else{
sel.innerHTML='<option>Sin locales</option>';
}
}
async function onLocalChange(){
let id=$('rLocal').value;
if(!id){
return;
}
localElegidoId=id;
let L=localesCache.find(x=>x.id===id);
if(!L){
return;
}
cfgLocal=L;
let bloq=checkBloqueo(L);
$('avisoBloqueo').classList.toggle('hidden',!bloq);
if(bloq){
$('avisoBloqueo').textContent='⚠️ '+bloq;
$('btnReservar').disabled=true;
return;
}else{
$('btnReservar').disabled=false;
}
$('btnWA').href=L.tel?`https://wa.me/${L.tel.replace(/\D/g,'')}`:'#';
let diasAnt=Number(L.diasAnticipacion||30);
let hoy=new Date();
hoy.setHours(0,0,0,0);
let max=new Date();
max.setDate(hoy.getDate()+diasAnt);
$('rFecha').min=hoy.toISOString().split('T')[0];
$('rFecha').max=max.toISOString().split('T')[0];
if(!$('rFecha').value){
let t=new Date();
t.setDate(t.getDate()+1);
$('rFecha').valueAsDate=t;
}
try{
let hSnap=await db.collection('config').doc(id).collection('horarios').get();
horariosCache={};
hSnap.forEach(d=>{
horariosCache[d.id]=d.data();
});
}catch(e){
horariosCache={};
}
let snap=await db.collection('servicios').where('localId','==',localElegidoId).where('activo','==',true).get();
let selS=$('rServicio');
selS.innerHTML='';
snap.forEach(d=>{
let s=d.data();
let o=document.createElement('option');
o.value=s.nombre;
o.textContent=`${s.nombre} - $${s.precio}`;
o.dataset.dur=s.duracion;
o.dataset.pr=s.precio;
selS.appendChild(o);
});
if(!selS.options.length){
selS.innerHTML='<option>Sin servicios</option>';
$('slots').innerHTML='';
return;
}
checkSena();
generarSlotsUI();
$('soporteLocal').value=id;
cargarReservasEnSoporte();
}
function checkSena(){
if(!cfgLocal){
pideSenaActiva=false;
return;
}
let fecha=$('rFecha').value;
if(!fecha){
$('boxSena').classList.add('hidden');
return;
}
let pide=cfgLocal.pideSena===true||cfgLocal.senaActiva===true;
let desde=Number(cfgLocal.senaDesdeDias||cfgLocal.senaAplicaDesdeDias||0);
let hoy=new Date();
hoy.setHours(0,0,0,0);
let fSel=new Date(fecha+'T12:00:00');
let diff=Math.ceil((fSel-hoy)/86400000);
let aplica=pide&&diff>=desde;
if(aplica){
let tipo=cfgLocal.senaTipo||'fijo';
let valor=Number(cfgLocal.senaValor||0);
let opt=$('rServicio').options[$('rServicio').selectedIndex];
let precio=Number(opt?.dataset.pr||0);
let monto=tipo==='porcentaje'?Math.round(precio*valor/100):valor;
pideSenaActiva=true;
montoSenaAct=monto;
$('boxSena').classList.remove('hidden');
$('txtSena').textContent=`Este turno requiere seña de $${monto}`;
$('txtAlias').textContent=`Alias: ${cfgLocal.cobAlias||cfgLocal.alias||'Consultar'}`;
$('inpDni').classList.toggle('hidden',!cfgLocal.pideDni);
}else{
pideSenaActiva=false;
montoSenaAct=0;
$('boxSena').classList.add('hidden');
}
}
async function generarSlotsUI(){
let fecha=$('rFecha').value;
let selS=$('rServicio');
let opt=selS.options[selS.selectedIndex];
if(!fecha||!opt||!opt.value){
$('slots').innerHTML='<span style="font-size:11px;opacity:.7">Elegí fecha y servicio</span>';
return;
}
let dur=Number(opt.dataset.dur||30);
let snap=await db.collection('reservas').where('localId','==',localElegidoId).where('fecha','==',fecha).where('estado','!=','cancelada').get();
let res=snap.docs.map(d=>d.data());
$('slots').innerHTML='';
let ap=cfgLocal.apertura||'09:00';
let ci=cfgLocal.cierre||'18:00';
let ac=toMin(ap);
let fin=toMin(ci);
let hay=false;
while(ac+dur<=fin){
let h=`${String(Math.floor(ac/60)).padStart(2,'0')}:${String(ac%60).padStart(2,'0')}`;
let cfgH=horariosCache[h]||{};
let cupoMax=Number(cfgH.cupoMax||cfgLocal.cupoPorDefecto||1);
if(cfgH.activo===false){
cupoMax=0;
}
let ocupadas=res.filter(r=>r.hora===h).length;
let libres=cupoMax-ocupadas;
let oc=libres<=0||cupoMax===0;
let b=document.createElement('button');
b.style.cssText=`padding:9px 12px;border-radius:999px;border:1px solid #ffffff1e;background:${oc?'#00000022':'#ffffff12'};color:#fff;font-size:12px;cursor:${oc?'not-allowed':'pointer'};${oc?'opacity:.35':''}`;
b.textContent=`${h} (${ocupadas}/${cupoMax})`;
if(!oc){
hay=true;
b.onclick=()=>{
horaElegida=h;
document.querySelectorAll('#slots button').forEach(x=>{
x.style.background='#ffffff12';
x.style.color='#fff';
});
b.style.background='#fff';
b.style.color='#3a0f6e';
$('slotInfo').textContent='Elegiste '+h;
};
}
$('slots').appendChild(b);
ac+=dur;
}
if(!hay){
$('slots').innerHTML='<span style="font-size:11px">Sin cupos libres</span>';
}
}
</script>

async function cargarMisReservas(){
let snap=await db.collection('reservas').where('clienteUid','==',auth.currentUser.uid).orderBy('creado','desc').limit(30).get();
reservasCache=[];
snap.forEach(doc=>{
reservasCache.push({
id:doc.id,
...doc.data()
});
});
$('listaReservas').innerHTML=snap.docs.map(d=>{
let r=d.data();
let col=r.estado==='pendiente_sena'?'#fde68a':'#fff';
return `<li style="display:flex;justify-content:space-between;padding:10px;border:1px solid #ffffff1e;border-radius:12px;background:#ffffff0f;margin-bottom:6px"><div><b style="font-size:13px">${r.servicio}</b><div style="font-size:11px;opacity:.7">${r.fecha} ${r.hora} - ${r.nombreLocal} - <b style="color:${col}">${r.estado}</b></div></div><div style="font-size:11px">$${r.precio||0}</div></li>`;
}).join('')||'<li>Sin reservas</li>';
cargarReservasEnSoporte();
}
function cargarReservasEnSoporte(){
let sel=$('soporteReserva');
if(!sel){
return;
}
let localId=$('soporteLocal').value||localElegidoId;

reservasCache.filter(r=>{
return!localId||r.localId===localId;
}).forEach(r=>{
let o=document.createElement('option');
o.value=r.id;
o.textContent=`${r.fecha} ${r.hora} - ${r.servicio} - ${r.estado}`;
sel.appendChild(o);
});
}
