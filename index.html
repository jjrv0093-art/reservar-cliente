<script>
const firebaseConfig={
apiKey:"AIzaSyC57wshaJ2EuIBoBdXv18opL4u_Vuw2bAQ",
authDomain:"reservar-cb70d.firebaseapp.com",
projectId:"reservar-cb70d",
storageBucket:"reservar-cb70d.firebasestorage.app",
messagingSenderId:"630908928696",
appId:"1:630908928696:web:5e89f5f2b240e6a4d"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const $=id=>document.getElementById(id);
const toast=m=>{
let t=$('toast');
t.textContent=m;
t.classList.remove('hidden');
setTimeout(()=>t.classList.add('hidden'),2500);
};
const toMin=h=>{
let a=h.split(':').map(Number);
return a[0]*60+a[1];
};
let cfgLocal=null;
let localElegidoId=null;
let horaElegida=null;
let localesCache=[];
let pideSenaActiva=false;
let montoSenaAct=0;
let horariosCache={};
let capturaSoporteBase64='';
function goScreen(n){
document.querySelectorAll('.navBtn').forEach(b=>{
b.style.color=b.dataset.screen===n?'#fff':'#bda8e0';
});
$('app').classList.toggle('hidden',n!=='inicio');
$('s-reservas').classList.toggle('hidden',n!=='reservas');
$('s-favoritos').classList.toggle('hidden',n!=='favoritos');
$('s-perfil').classList.toggle('hidden',n!=='perfil');
}
document.querySelectorAll('.navBtn').forEach(b=>{
b.addEventListener('click',()=>goScreen(b.dataset.screen));
});
$('loginBtn').onclick=async()=>{
let em=$('email').value.trim().toLowerCase();
let ps=$('pass').value.trim();
if(!em||!ps){
$('loginMsg').textContent='Completa datos';
return;
}
$('loginMsg').textContent='Entrando...';
try{
await auth.signInWithEmailAndPassword(em,ps);
}catch(e){
$('loginMsg').textContent=e.message;
}
};
$('goReg').onclick=()=>{
$('loginFields').classList.add('hidden');
$('regFields').classList.remove('hidden');
};
$('backLog').onclick=()=>{
$('regFields').classList.add('hidden');
$('loginFields').classList.remove('hidden');
};
$('regBtn').onclick=async()=>{
let em=$('rEmail').value.trim().toLowerCase();
let ps=$('rPass').value.trim();
if(ps.length<6){
$('regMsg').textContent='Min 6';
return;
}
try{
let cr=await auth.createUserWithEmailAndPassword(em,ps);
await db.collection('clientes').doc(cr.user.uid).set({
nombre:$('rNom').value.trim(),
whatsapp:$('rWsp').value.trim(),
direccion:$('rDir').value.trim(),
email:em,
creado:Date.now()
});
}catch(e){
$('regMsg').textContent=e.message;
}
};
$('forgotBtn').onclick=async()=>{
let em=$('email').value.trim().toLowerCase();
if(!em){
$('loginMsg').textContent='Escribi mail';
return;
}
await auth.sendPasswordResetEmail(em);
$('loginMsg').style.color='#86efac';
$('loginMsg').textContent='Mail enviado';
};
$('btnLogout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
if(!u){
$('app').classList.add('hidden');
$('s-reservas').classList.add('hidden');
$('s-favoritos').classList.add('hidden');
$('s-perfil').classList.add('hidden');
$('authBox').classList.remove('hidden');
$('topbar').classList.add('hidden');
$('bottomNav').classList.add('hidden');
return;
}
$('authBox').classList.add('hidden');
$('app').classList.remove('hidden');
$('topbar').classList.remove('hidden');
$('bottomNav').classList.remove('hidden');
let cli=await db.collection('clientes').doc(u.uid).get();
let d=cli.data()||{};
let nombre=d.nombre||u.email.split('@')[0];
$('saludo').textContent='Hola, '+nombre;
$('avatarTop').textContent=nombre.slice(0,2).toUpperCase();

$('pNom').value=d.nombre||'';
$('pWsp').value=d.whatsapp||'';
$('pDir').value=d.direccion||'';
$('pMail').value=d.email||u.email;
cargarLocales();
cargarMisReservas();
goScreen('inicio');
});
function checkBloqueo(l){
if(l.planActivo===false)return 'Vencido';
if(l.visible===false)return 'Pausado';
if(l.reservasPausadas===true)return 'Pauso reservas';
return null;
}
async function cargarLocales(){
let sel=$('rLocal');
sel.innerHTML='<option>Cargando</option>';
let snap=await db.collection('config').get();
localesCache=[];
snap.forEach(doc=>{
if(['global','cobros','planes','adm','branding'].includes(doc.id))return;
localesCache.push({id:doc.id,...doc.data()});
});
localesCache=localesCache.filter(l=>!checkBloqueo(l));
$('destacados').innerHTML=localesCache.map(l=>{
return `<div style="display:flex;gap:10px;background:#ffffff10;border:1px solid #ffffff18;border-radius:14px;padding:8px;margin-bottom:8px;cursor:pointer" onclick="document.getElementById('rLocal').value='${l.id}';document.getElementById('rLocal').dispatchEvent(new Event('change'))"><div><b>${l.localNombre||'Local'}</b><div style="font-size:11px;opacity:.7">${l.direccion||''}</div></div></div>`;
}).join('');
sel.innerHTML='';
let selSop=$('soporteLocal');
selSop.innerHTML='<option value="">Elegi local con inconveniente</option>';
localesCache.forEach(l=>{
let o=document.createElement('option');
o.value=l.id;
o.textContent=l.localNombre||'Local';
sel.appendChild(o);
let o2=o.cloneNode(true);
selSop.appendChild(o2);
});
if(sel.options.length){
sel.selectedIndex=0;
onLocalChange();
}
}
async function onLocalChange(){
let id=$('rLocal').value;
if(!id)return;
localElegidoId=id;
let L=localesCache.find(x=>x.id===id);
if(!L)return;
cfgLocal=L;
let bloq=checkBloqueo(L);
$('avisoBloqueo').classList.toggle('hidden',!bloq);
if(bloq){
$('avisoBloqueo').textContent=bloq;
$('btnReservar').disabled=true;
return;
}
$('btnReservar').disabled=false;
$('btnWA').href=L.tel?`https://wa.me/${L.tel.replace(/\D/g,'')}`:'#';
let hoy=new Date();
hoy.setHours(0,0,0,0);
let max=new Date();
max.setDate(hoy.getDate()+Number(L.diasAnticipacion||30));
$('rFecha').min=hoy.toISOString().split('T')[0];
$('rFecha').max=max.toISOString().split('T')[0];
if(!$('rFecha').value){
let t=new Date();
t.setDate(t.getDate()+1);
$('rFecha').valueAsDate=t;
}
try{
let hSnap=await db.collection('config').doc(id).collection('horarios').get();
horariosCache={};
hSnap.forEach(d=>{
horariosCache[d.id]=d.data();
});
}catch(e){
horariosCache={};
}
let snap=await db.collection('servicios').where('localId','==',localElegidoId).where('activo','==',true).get();
let selS=$('rServicio');
selS.innerHTML='';
snap.forEach(d=>{
let s=d.data();
let o=document.createElement('option');
o.value=s.nombre;
o.textContent=s.nombre+' - $'+s.precio;
o.dataset.dur=s.duracion;
o.dataset.pr=s.precio;
selS.appendChild(o);
});
checkSena();
generarSlotsUI();
$('soporteLocal').value=id;
}
function checkSena(){
if(!cfgLocal)return;
let fecha=$('rFecha').value;
if(!fecha){
$('boxSena').classList.add('hidden');
return;
}
let pide=cfgLocal.pideSena===true||cfgLocal.senaActiva===true;
let desde=Number(cfgLocal.senaDesdeDias||0);
let hoy=new Date();
hoy.setHours(0,0,0,0);
let fSel=new Date(fecha+'T12:00:00');
let diff=Math.ceil((fSel-hoy)/86400000);
let aplica=pide&&diff>=desde;
if(aplica){
let tipo=cfgLocal.senaTipo||'fijo';
let valor=Number(cfgLocal.senaValor||0);
let opt=$('rServicio').options[$('rServicio').selectedIndex];
let precio=Number(opt?.dataset.pr||0);
let monto=tipo==='porcentaje'?Math.round(precio*valor/100):valor;
pideSenaActiva=true;
montoSenaAct=monto;
$('boxSena').classList.remove('hidden');
$('txtSena').textContent='Sena $'+monto;
$('txtAlias').textContent='Alias: '+(cfgLocal.cobAlias||cfgLocal.alias||'Consultar');
$('inpDni').classList.toggle('hidden',!cfgLocal.pideDni);
}else{
pideSenaActiva=false;
$('boxSena').classList.add('hidden');
}
}
async function generarSlotsUI(){
let fecha=$('rFecha').value;
let selS=$('rServicio');
let opt=selS.options[selS.selectedIndex];
if(!fecha||!opt){
$('slots').innerHTML='Elegi fecha';
return;
}
let dur=Number(opt.dataset.dur||30);
let snap=await db.collection('reservas').where('localId','==',localElegidoId).where('fecha','==',fecha).where('estado','!=','cancelada').get();
let res=snap.docs.map(d=>d.data());
$('slots').innerHTML='';
let ac=toMin(cfgLocal.apertura||'09:00');
let fin=toMin(cfgLocal.cierre||'18:00');
while(ac+dur<=fin){
let h=String(Math.floor(ac/60)).padStart(2,'0')+':'+String(ac%60).padStart(2,'0');
let cfgH=horariosCache[h]||{};
let cupoMax=Number(cfgH.cupoMax||cfgLocal.cupoPorDefecto||1);
if(cfgH.activo===false)cupoMax=0;
let ocupadas=res.filter(r=>r.hora===h).length;
let oc=ocupadas>=cupoMax||cupoMax===0;
let b=document.createElement('button');
b.style.cssText='padding:9px 12px;border-radius:999px;border:1px solid #ffffff1e;background:'+(oc?'#0002':'#ffffff12')+';color:#fff;font-size:12px;opacity:'+(oc?'.35':'1');
b.textContent=h+' ('+ocupadas+'/'+cupoMax+')';
if(!oc){
b.onclick=()=>{
horaElegida=h;
document.querySelectorAll('#slots button').forEach(x=>{
x.style.background='#ffffff12';
x.style.color='#fff';
});
b.style.background='#fff';
b.style.color='#3a0f6e';
$('slotInfo').textContent=h;
};
}
$('slots').appendChild(b);
ac+=dur;
}
}
$('btnReservar').onclick=async()=>{
if(!localElegidoId||!horaElegida||!$('rFecha').value){
toast('Elegi fecha y hora');
return;
}
let opt=$('rServicio').options[$('rServicio').selectedIndex];
let dur=Number(opt.dataset.dur||30);
if(cfgLocal.pideDni&&!$('inpDni').value.trim()){
toast('DNI obligatorio');
return;
}
if(pideSenaActiva&&!$('inpComp').value.trim()){
toast('Comprobante');
return;
}
let chk=await db.collection('reservas').where('localId','==',localElegidoId).where('fecha','==',$('rFecha').value).where('hora','==',horaElegida).where('estado','!=','cancelada').get();
let cupoCfg=horariosCache[horaElegida]||{};
let cupoMax=Number(cupoCfg.cupoMax||cfgLocal.cupoPorDefecto||1);
if(chk.size>=cupoMax){
toast('Sin cupo');
return;
}
let estado=pideSenaActiva?'pendiente_sena':'confirmada';
await db.collection('reservas').add({
localId:localElegidoId,
uidLocal:localElegidoId,
nombreLocal:cfgLocal.localNombre,
clienteUid:auth.currentUser.uid,
cliente:auth.currentUser.email,
clienteNombre:$('pNom').value||auth.currentUser.email,
servicio:opt.value,
fecha:$('rFecha').value,
hora:horaElegida,
fechaHora:$('rFecha').value+' '+horaElegida,
duracion:dur,
precio:Number(opt.dataset.pr||0),
estado,
senaMonto:pideSenaActiva?montoSenaAct:0,
dni:$('inpDni').value.trim(),
comprobante:$('inpComp').value.trim(),
ts:Date.now(),
creado:firebase.firestore.FieldValue.serverTimestamp()
});
toast('Reserva OK');
cargarMisReservas();
generarSlotsUI();
goScreen('reservas');
};
async function cargarMisReservas(){
let snap=await db.collection('reservas').where('clienteUid','==',auth.currentUser.uid).orderBy('creado','desc').limit(30).get();
$('listaReservas').innerHTML=snap.docs.map(d=>{
let r=d.data();
return `<li style="display:flex;justify-content:space-between;padding:10px;border:1px solid #ffffff1e;border-radius:12px;background:#ffffff0f;margin-bottom:6px"><div><b style="font-size:13px">${r.servicio}</b><div style="font-size:11px;opacity:.7">${r.fecha} ${r.hora} - ${r.nombreLocal} - ${r.estado}</div></div><div style="font-size:11px">$${r.precio||0}</div></li>`;
}).join('')||'<li>Sin reservas</li>';
}
$('btnSavePerf').onclick=async()=>{
await db.collection('clientes').doc(auth.currentUser.uid).update({
nombre:$('pNom').value.trim(),
whatsapp:$('pWsp').value.trim(),
direccion:$('pDir').value.trim()
});
toast('Guardado');
};
$('soporteFile').onchange=e=>{
let f=e.target.files[0];
if(!f)return;
let r=new FileReader();
r.onload=ev=>{
capturaSoporteBase64=ev.target.result;
$('soportePreview').innerHTML=`<img src="${capturaSoporteBase64}" style="max-width:180px;border-radius:10px;border:1px solid #fff3">`;
};
r.readAsDataURL(f);
};
$('btnSoportePerfil').onclick=async()=>{
let localId=$('soporteLocal').value;
let fechaProb=$('soporteFecha').value;
let horaProb=$('soporteHora').value;
let msg=$('soporteMsgTxt').value.trim();
if(!localId){
toast('Elegi local');
return;
}
if(!fechaProb){
toast('Fecha problema');
return;
}
if(!horaProb){
toast('Hora problema');
return;
}
if(!msg){
toast('Escribi que paso');
return;
}
let L=localesCache.find(x=>x.id===localId)||cfgLocal||{};
let cliDoc=await db.collection('clientes').doc(auth.currentUser.uid).get();
let cli=cliDoc.data()||{};
let ahora=new Date();
let fechaEnv=ahora.toLocaleDateString('es-AR');
let horaEnv=ahora.toLocaleTimeString('es-AR');
await db.collection('soporte').add({
origen:'cliente',
uidCliente:auth.currentUser.uid,
idCliente:auth.currentUser.uid,
nombreCliente:cli.nombre||$('pNom').value||auth.currentUser.email,
emailCliente:auth.currentUser.email,
whatsappCliente:cli.whatsapp||$('pWsp').value||'',
direccionCliente:cli.direccion||$('pDir').value||'',
perfilCompleto:cli,
uidLocal:localId,
idLocal:localId,
nombreLocal:L.localNombre||'Local',
direccionLocal:L.direccion||'',
telLocal:L.tel||'',
datosLocalCompleto:L,
fechaProblema:fechaProb,
horaProblema:horaProb,
fechaHoraProblema:fechaProb+' '+horaProb,
fechaEnvio:fechaEnv,
horaEnvio:horaEnv,
fechaHoraEnvio:fechaEnv+' '+horaEnv,
mensaje:msg,
imagen:capturaSoporteBase64||'',
ts:Date.now(),
creado:firebase.firestore.FieldValue.serverTimestamp()
});
$('soporteMsgTxt').value='';
$('soportePreview').innerHTML='';
capturaSoporteBase64='';
toast('Soporte enviado');
};
(()=>{
let t=new Date();
t.setDate(t.getDate()+1);
let f=$('rFecha');
if(f)f.valueAsDate=t;
let fs=$('soporteFecha');
if(fs)fs.valueAsDate=new Date();
$('soporteHora').value=new Date().toTimeString().slice(0,5);
})();
$('searchLocal').addEventListener('input',e=>{
let q=e.target.value.toLowerCase();
document.querySelectorAll('#destacados>div').forEach(d=>{
d.style.display=d.textContent.toLowerCase().includes(q)?'flex':'none';
});
});
$('rFecha').addEventListener('change',()=>{
checkSena();
generarSlotsUI();
});
$('rServicio').addEventListener('change',()=>{
checkSena();
generarSlotsUI();
});
$('rLocal').addEventListener('change',()=>onLocalChange());
</script>
</body>
</html>
