<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>reservAR Cliente - Spa Uñas Gym</title>
<style>
:root{--stroke:#ffffff26}*{box-sizing:border-box}body{margin:0;font-family:system-ui;color:#fff;background:linear-gradient(160deg,#6a11cb,#7b1fa2 40%,#3a0f6e 70%,#0a0933);background-attachment:fixed;min-height:100vh}
.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(31,7,54,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--stroke)}
.logo{font-weight:900;font-size:22px}.logo span{font-weight:300;font-size:13px;color:#d8d0f0;margin-left:6px}.pill{padding:6px 12px;border-radius:999px;background:#ffffff1f;border:1px solid var(--stroke);font-size:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#ff5ab3);display:grid;place-items:center;font-weight:800;cursor:pointer;border:2px solid #ffffff44}
.wrap{max-width:1100px;margin:0 auto;padding:16px}.hero{margin:20px 0 12px}.hero h1{margin:0;font-size:clamp(22px,5vw,32px);line-height:1.15;font-weight:900}.hero h1 small{display:block;font-weight:400;font-size:clamp(16px,3.5vw,20px);color:#e6d8ff;margin-top:4px}
.card{background:#ffffff12;border:1px solid var(--stroke);border-radius:16px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px)}.input{width:100%;padding:.75rem .9rem;border-radius:14px;border:1px solid #ffffff22;background:#ffffff14;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.localCard{background:#fffffffa;color:#1a1040;border-radius:16px;padding:10px;overflow:hidden;border:1px solid #ffffff55}
.localCard .img{height:110px;border-radius:12px;background:#e9e0ff center/cover;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px}.badge{background:#fde68a;color:#000;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}
.btn{background:#a855f7;border:none;color:#fff;padding:.6rem .9rem;border-radius:10px;cursor:pointer;font-weight:700}.btn.full{width:100%}.btn.ghost{background:transparent;border:1px solid #ffffff44;color:#fff}.btn.small{padding:.4rem .6rem;font-size:12px}
.modal{position:fixed;inset:0;z-index:100;background:#0008;display:flex;align-items:flex-end;justify-content:center}.modalBox{width:100%;max-width:560px;background:#faf7ff;color:#1a1040;border-radius:22px 22px 0 0;padding:18px 16px 24px;max-height:88vh;overflow:auto;border:1px solid #ffffff88}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f0736;border:1px solid #ffffff33;padding:10px 16px;border-radius:12px;z-index:9999;color:#fff}
#btnSoporte{position:fixed;right:18px;bottom:18px;z-index:50;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#a855f7,#ff5ab3);box-shadow:0 8px 24px #0006;font-size:24px;color:#fff}
</style>
<script src='https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js'></script><script src='https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js'></script><script src='https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js'></script>
</head><body>
<div class='topbar'><div class='logo'>reservAR <span>tu lugar, tu momento.</span></div><div style='display:flex;gap:10px;align-items:center'><span class='pill'>Panel Cliente</span><div id='avatarJD' class='avatar'>JD</div><button id='btnLogout' class='btn small ghost hidden'>Salir</button></div></div>
<section id='auth' style='max-width:420px;margin:30px auto;background:#ffffff12;border:1px solid var(--stroke);border-radius:14px;padding:20px'><h2 style='margin-top:0'>Iniciar sesión</h2><input id='email' class='input' type='email' placeholder='tu@correo.com' style='margin-bottom:8px'><input id='password' class='input' type='password' placeholder='Contraseña' style='margin-bottom:8px'><p id='loginMsg' style='color:#fca5a5;min-height:18px;font-size:13px'></p><button id='loginBtn' class='btn full'>Entrar</button><p style='text-align:center'><a href='#' id='goForgot' style='color:#cfc9e6;font-size:13px'>Olvidaste tu contraseña?</a></p><p style='font-size:14px'>No tenés cuenta? <a href='#' id='goRegister' style='color:#ff5ab3'>Crear cuenta</a></p></section>
