<style>
:root{--stroke:#ffffff1e;--panel:#ffffff10}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui;color:#fff;background:#4f10a8}
body{background:linear-gradient(180deg,#6a11cb 0%,#5a14c0 45%,#1e084a 100%) no-repeat}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:8px 10px 100px}

.auth input{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff12;color:#fff;margin-bottom:10px;font-size:14px;outline:none}
.btn{background:#a855f7;border:0;color:#fff;padding:14px;border-radius:12px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--stroke)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.navBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:48px}
.navBtn i{font-size:20px;line-height:1;font-style:normal}
</style>

</head>
<body>

<label style="background:#ffffff18;border:1px solid #ffffff28;border-radius:10px;padding:8px 12px;font-size:11px;cursor:pointer">Cambiar foto<input id="perfilFotoFile" type="file" accept="image/*" style="display:none"></label>
</div>

<label style="font-size:11px">WhatsApp</label>
<input id="pWsp" style="width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff33;background:#00000033;color:#fff;margin-bottom:10px">
<label style="font-size:11px">Direccion</label>
<input id="pDir" style="width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff33;background:#00000033;color:#fff;margin-bottom:10px">

<input id="pMail" disabled style="width:100%;padding:14px;border-radius:12px;background:#ffffff15;color:#fff;border:1px solid #ffffff33;opacity:1">
<button id="btnSavePerf" class="btn full" style="margin-top:10px">Guardar cambios</button>
</div>
<div style="background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:14px 12px">

<select id="soporteLocal" style="width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff33;background:#00000044;color:#fff;margin-bottom:8px"><option value="">Elegi local</option></select>
<label style="font-size:11px;opacity:.8">Reserva relacionada</label>
<select id="soporteReserva" style="width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff33;background:#00000044;color:#fff;margin-bottom:8px"><option value="">Sin reserva / consulta general</option></select>
<div style="display:flex;gap:8px">
<div style="flex:1"><label style="font-size:11px;opacity:.8">Fecha</label><input id="soporteFecha" type="date" style="width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff33;background:#00000044;color:#fff"></div>
<div style="flex:1"><label style="font-size:11px;opacity:.8">Hora</label><input id="soporteHora" type="time" style="width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff33;background:#00000044;color:#fff"></div>
</div>
<textarea id="soporteMsg" placeholder="Contanos que paso..." style="width:100%;padding:14px;border-radius:12px;background:#00000033;color:#fff;min-height:80px;border:1px solid #ffffff33;margin-top:8px"></textarea>
<label style="display:block;margin-top:8px;background:#a855f7;border-radius:12px;padding:12px;text-align:center;font-weight:700;font-size:12px;cursor:pointer">Seleccionar archivo<input id="soporteFile" type="file" accept="image/*" style="display:none"></label>
<div id="soportePreview" style="margin-top:6px"></div>
<button id="btnSoportePerfil" class="btn full" style="margin-top:8px;background:#fff;color:#3a0f6e">Enviar a Soporte</button>
</div>
<div style="background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:14px 12px;margin-top:10px"><button id="btnLogout" class="btn ghost full">Salir</button></div>
</div>
<div id="bottomNav" class="hidden" style="position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,7,48,.98);border-top:1px solid #ffffff24;display:flex;justify-content:space-around;padding:8px 0 10px">
<button data-screen="inicio" class="navBtn" style="background:transparent;border:0;color:#fff"><i>🏠</i><span style="font-size:12px;font-weight:700;margin-top:2px">Inicio</span></button>
<button data-screen="reservas" class="navBtn" style="background:transparent;border:0;color:#bda8e0"><i>📅</i><span style="font-size:12px;font-weight:700;margin-top:2px">Reservas</span></button>
<button data-screen="favoritos" class="navBtn" style="background:transparent;border:0;color:#bda8e0"><i>❤️</i><span style="font-size:12px;font-weight:700;margin-top:2px">Favoritos</span></button>
<button data-screen="perfil" class="navBtn" style="background:transparent;border:0;color:#bda8e0"><i>👤</i><span style="font-size:12px;font-weight:700;margin-top:2px">Perfil</span></button>
</div>
<div id="toast" class="hidden" style="position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#1f0736;border:1px solid #ffffff33;padding:10px 14px;border-radius:10px;z-index:9999;font-size:13px"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyC57wshaJ2EuIBoBdXv18opL4u_Vuw2bAQ",authDomain:"reservar-cb70d.firebaseapp.com",projectId:"reservar-cb70d",storageBucket:"reservar-cb70d.firebasestorage.app",messagingSenderId:"630908928696",appId:"1:630908928696:web:5e89f5f2b1cc2b240e6a4d",measurementId:"G-2HMNZ69E4G"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const $=id=>document.getElementById(id);
const toast=m=>{let t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600);};
const toMin=h=>{let a=h.split(':').map(Number);return a[0]*60+a[1];};
const errEs=c=>{c=(c||'').toLowerCase();if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'Correo o contrasena incorrectos';if(c.includes('email-already'))return 'Este correo ya existe';if(c.includes('weak-password'))return 'Contrasena minimo 6';return c;};
let cfgLocal=null;let localElegidoId=null;let horaElegida=null;let localesCache=[];let reservasCache=[];let pideSenaActiva=false;let montoSenaAct=0;let horariosCache={};let pausasFechasCache={};let capturaSoporteBase64='';let perfilFotoBase64='';let favsCache=[];let cfgAdm={horasPlan:48};
let galeriasCache={};
function getVenceDate(l){if(!l)return null;const pv=l.planVence||l;if(!pv)return null;try{if(pv.toDate)return pv.toDate();if(pv.seconds)return new Date(pv.seconds*1000);const d=new Date(pv);return isNaN(d.getTime())?null:d;}catch(e){return null;}}
function estaActivoReal(l){
 if(!l) return false;
 if(l.bloqueado===true) return false;
 if(l.planActivo===false) return false;
 if(l.visible===false) return false;
 const v=getVenceDate(l);
 if(!v) return true;
 return (new Date()-v)/36e5 <= (cfgAdm.horasPlan||48);
}
 function estaBloqueadoPorPago(l){
 if(!l) return true;
 if(l.bloqueado===true) return true;
 if(l.planActivo===false) return true;
 if(l.visible===false) return true;
 const v=getVenceDate(l);
 if(!v) return false;
 return (new Date()-v)/36e5 > (cfgAdm.horasPlan||48);
}
function estaPausadoTotal(l,fecha){
 if(!l) return 'Local no existe';
 if(estaBloqueadoPorPago(l)) return null;
 if(l.reservasPausadas===true) return 'Pauso reservas temporalmente';
 if(fecha && pausasFechasCache[fecha]) return 'Pausado para este dia '+fecha;
 return null;
}
function goScreen(n){
document.querySelectorAll('.navBtn').forEach(b=>{b.style.color=b.dataset.screen===n?'#fff':'#bda8e0';});
$('app').classList.toggle('hidden',n!=='inicio');
$('s-reservas').classList.toggle('hidden',n!=='reservas');
$('s-favoritos').classList.toggle('hidden',n!=='favoritos');
$('s-perfil').classList.toggle('hidden',n!=='perfil');
}
document.querySelectorAll('.navBtn').forEach(b=>{b.addEventListener('click',()=>goScreen(b.dataset.screen));});
$('loginBtn').onclick=async()=>{let em=$('email').value.trim().toLowerCase();let ps=$('pass').value.trim();if(!em||!ps){$('loginMsg').textContent='Completa datos';return;}$('loginMsg').textContent='Entrando...';try{await auth.signInWithEmailAndPassword(em,ps);}catch(e){$('loginMsg').textContent=errEs(e.message);}};
$('goReg').onclick=()=>{$('loginFields').classList.add('hidden');$('regFields').classList.remove('hidden');$('authTitle').textContent='Crear cuenta';};
$('backLog').onclick=()=>{$('regFields').classList.add('hidden');$('loginFields').classList.remove('hidden');$('authTitle').textContent='Iniciar sesion';};
$('regBtn').onclick=async()=>{let em=$('rEmail').value.trim().toLowerCase();let ps=$('rPass').value.trim();if(ps.length<6){$('regMsg').textContent='Pass min 6';return;}try{let cr=await auth.createUserWithEmailAndPassword(em,ps);await db.collection('clientes').doc(cr.user.uid).set({nombre:$('rNom').value.trim(),whatsapp:$('rWsp').value.trim().replace(/\D/g,''),direccion:$('rDir').value.trim(),email:em,creado:Date.now()});}catch(e){$('regMsg').textContent=errEs(e.message);}};
$('forgotBtn').onclick=async()=>{let em=$('email').value.trim().toLowerCase();if(!em){$('loginMsg').textContent='Escribi tu email';return;}await auth.sendPasswordResetEmail(em);$('loginMsg').style.color='#86efac';$('loginMsg').textContent='Mail enviado';};
$('btnLogout').onclick=()=>auth.signOut();
$('searchLocal').addEventListener('input',e=>{
 let q=e.target.value.toLowerCase().trim();
 document.querySelectorAll('#destacados>div').forEach(d=>{
   d.style.display=d.dataset.nombre.includes(q)?'flex':'none';
 });
 Array.from($('rLocal').options).forEach(o=>{
   o.hidden = q &&!o.textContent.toLowerCase().includes(q);
 });
});
$('rFecha').addEventListener('change',()=>{checkDni();checkSena();generarSlotsUI();});
$('rServicio').addEventListener('change',()=>{checkDni();checkSena();generarSlotsUI();});
$('rLocal').addEventListener('change',()=>onLocalChange());
$('soporteLocal').addEventListener('change',()=>cargarReservasEnSoporte());
auth.onAuthStateChanged(async u=>{
if(!u){$('app').classList.add('hidden');$('s-reservas').classList.add('hidden');$('s-favoritos').classList.add('hidden');$('s-perfil').classList.add('hidden');$('authBox').classList.remove('hidden');$('topbar').classList.add('hidden');$('bottomNav').classList.add('hidden');return;}
$('authBox').classList.add('hidden');$('app').classList.remove('hidden');$('topbar').classList.remove('hidden');$('bottomNav').classList.remove('hidden');
try{let adm=await db.collection('config').doc('adm').get(); if(adm.exists) cfgAdm=adm.data();}catch(e){}
let cli=await db.collection('clientes').doc(u.uid).get();
let d=cli.data()||{};
let nombre=d.nombre||u.email.split('@')[0];
$('saludo').innerHTML=`Hola, ${nombre}<br>un maravilloso dia`;
$('perfilNombre').textContent=nombre;
$('perfilEmail').textContent=u.email;
$('pNom').value=d.nombre||'';
$('pWsp').value=d.whatsapp||'';
$('pDir').value=d.direccion||'';
$('pMail').value=d.email||u.email;
perfilFotoBase64=d.foto||'';
if(perfilFotoBase64){$('avatarTop').innerHTML=`<img src="${perfilFotoBase64}">`;$('perfilFotoBox').innerHTML=`<img src="${perfilFotoBase64}" style="width:100%;height:100%;object-fit:cover">`;}else{$('avatarTop').textContent=nombre.slice(0,2).toUpperCase();$('perfilFotoBox').textContent=nombre.slice(0,2).toUpperCase();}
cargarLocales();cargarMisReservas();cargarFavoritos();goScreen('inicio');
});
 async function cargarLocales(){
let sel=$('rLocal'); sel.innerHTML='<option>Cargando...</option>';
let snap=await db.collection('config').get();
localesCache=[];
snap.forEach(doc=>{if(['global','cobros','planes','adm','branding','promos','gastos','landing','logs'].includes(doc.id)) return; let dd=doc.data(); if(dd.visible===false) return; localesCache.push({id:doc.id,...dd});});
let visiblesActivos = localesCache.filter(l=>estaActivoReal(l));
let visiblesPausados = localesCache.filter(l=>!estaBloqueadoPorPago(l) &&!estaActivoReal(l));
let visibles = [...visiblesActivos,...visiblesPausados];
for(let L of visibles){
 try{
   if(!L.foto){
     let g=await db.collection('config').doc(L.id).collection('galeriaLocal').limit(1).get();
     if(!g.empty){ galeriasCache[L.id]=g.docs[0].data().url||g.docs[0].data().foto||''; }
   }
 }catch(e){}
}
$('destacados').innerHTML=visibles.map(l=>{
 let foto = l.foto || galeriasCache[l.id] || `https://picsum.photos/seed/${l.id}/200`;
 let esPaus =!estaActivoReal(l) &&!estaBloqueadoPorPago(l);
 let badge = esPaus? '<span style="background:#f59e0b;color:#000;font-size:9px;padding:2px 6px;border-radius:999px;margin-left:6px">PAUSADO</span>' : '';
 return `<div data-nombre="${(l.localNombre||l.nombre||'local').toLowerCase()}" style="display:flex;gap:10px;background:#ffffff10;border:1px solid #ffffff18;border-radius:14px;padding:8px;margin-bottom:8px;cursor:pointer" onclick="document.getElementById('rLocal').value='${l.id}';document.getElementById('rLocal').dispatchEvent(new Event('change'));window.scrollTo({top:0,behavior:'smooth'})"><img src="${foto}" style="width:68px;height:68px;border-radius:10px;object-fit:cover"><div><b>${l.localNombre||l.nombre||'Local'}${badge}</b><div style="font-size:11px;opacity:.7">${l.direccion||''}</div><div style="font-size:10px;opacity:.6">Ver servicios</div></div></div>`;
}).join('')||'<div style="font-size:12px;opacity:.7">Sin locales activos</div>';
sel.innerHTML=''; let selSop=$('soporteLocal'); selSop.innerHTML='<option value="">Elegi local</option>';
visibles.forEach(l=>{let o=document.createElement('option');o.value=l.id;o.textContent=l.localNombre||l.nombre||'Local';sel.appendChild(o);let o2=o.cloneNode(true);selSop.appendChild(o2);});
if(sel.options.length){sel.selectedIndex=0;onLocalChange();}else{sel.innerHTML='<option>Sin locales disponibles</option>';$('slots').innerHTML='';$('avisoBloqueo').classList.remove('hidden');$('avisoBloqueo').textContent='No hay locales activos, todos bloqueados por pago';}
}
async function onLocalChange(){
let id=$('rLocal').value; if(!id) return; localElegidoId=id;
let L=localesCache.find(x=>x.id===id); if(!L) return; cfgLocal=L;
try{let hSnap=await db.collection('config').doc(id).collection('horarios').get(); horariosCache={}; hSnap.forEach(d=>{horariosCache[d.id]=d.data();});}catch(e){horariosCache={};}
try{let pSnap=await db.collection('config').doc(id).collection('pausasFechas').get(); pausasFechasCache={}; pSnap.forEach(d=>{pausasFechasCache[d.id]=true;});}catch(e){pausasFechasCache={};}
let bloqPago = estaBloqueadoPorPago(L);
let pausaMsg = estaPausadoTotal(L, $('rFecha').value);
$('avisoBloqueo').classList.toggle('hidden',!bloqPago &&!pausaMsg);
if(bloqPago){$('avisoBloqueo').textContent='Local bloqueado por falta de pago'; $('btnReservar').disabled=true; $('slots').innerHTML='<span style="font-size:11px">Bloqueado</span>'; return;}
if(pausaMsg){$('avisoBloqueo').textContent=pausaMsg;}
$('btnReservar').disabled =!!bloqPago;
$('btnWA').href=L.tel||L.telefono?`https://wa.me/${(L.tel||L.telefono).replace(/\D/g,'')}`:'#';
actualizarBotonFav();
let diasAnt=Number(L.diasAnticipacion||30); let hoy=new Date(); hoy.setHours(0,0,0,0); let max=new Date(); max.setDate(hoy.getDate()+diasAnt);
$('rFecha').min=hoy.toISOString().split('T')[0]; $('rFecha').max=max.toISOString().split('T')[0];
if(!$('rFecha').value){let t=new Date(); t.setDate(t.getDate()+1); $('rFecha').valueAsDate=t;}
let selS=$('rServicio'); selS.innerHTML='';
try{
 let snapGlobal = await db.collection('servicios').where('localId','==',localElegidoId).get();
 let snapSub = await db.collection('config').doc(localElegidoId).collection('servicios').get();
 let mapa=new Map();
 snapGlobal.forEach(d=>{let s=d.data(); if(s.activo!==false && s.visible!==false) mapa.set(s.nombre,s);});
 snapSub.forEach(d=>{let s=d.data(); if(s.visible!==false) mapa.set(s.nombre,{nombre:s.nombre,precio:s.precio,duracion:s.duracion||60,activo:true});});
 mapa.forEach(s=>{let o=document.createElement('option'); o.value=s.nombre; o.textContent=`${s.nombre} - $${s.precio}`; o.dataset.dur=s.duracion||60; o.dataset.pr=s.precio; selS.appendChild(o);});
}catch(e){
 let snap=await db.collection('servicios').where('localId','==',localElegidoId).where('activo','==',true).get();
 snap.forEach(d=>{let s=d.data(); let o=document.createElement('option'); o.value=s.nombre; o.textContent=`${s.nombre} - $${s.precio}`; o.dataset.dur=s.duracion; o.dataset.pr=s.precio; selS.appendChild(o);});
}
if(!selS.options.length){selS.innerHTML='<option>Sin servicios</option>';$('slots').innerHTML=''; return;}
checkDni(); checkSena(); generarSlotsUI();
$('soporteLocal').value=id; cargarReservasEnSoporte();
}
function checkDni(){if(!cfgLocal){$('boxDni').classList.add('hidden');return;} let pide=cfgLocal.pideDni===true; if(pide){$('boxDni').classList.remove('hidden');}else{$('boxDni').classList.add('hidden');$('inpDni').value='';}}
function checkSena(){
 if(!cfgLocal){pideSenaActiva=false;return;}
 let fecha=$('rFecha').value; if(!fecha){$('boxSena').classList.add('hidden');pideSenaActiva=false;return;}
 let pide=cfgLocal.pideSena===true||cfgLocal.senaActiva===true;
 let desde=Number(cfgLocal.senaDesdeDias||cfgLocal.senaAplicaDesdeDias||0);
 let hoy=new Date(); hoy.setHours(0,0,0,0); let fSel=new Date(fecha+'T12:00:00'); let diff=Math.ceil((fSel-hoy)/86400000);
 let aplica=pide&&diff>=desde;
 if(aplica){
   let tipo=cfgLocal.senaTipo||'fijo'; let valor=Number(cfgLocal.senaValor||0);
   let opt=$('rServicio').options[$('rServicio').selectedIndex]; let precio=Number(opt?.dataset.pr||0);
   let monto=tipo==='porcentaje'?Math.round(precio*valor/100):valor;
   pideSenaActiva=true; montoSenaAct=monto;
   $('boxSena').classList.remove('hidden'); $('txtSena').textContent=`Este turno requiere sena de $${monto}`; $('txtAlias').textContent=`Alias: ${cfgLocal.cobAlias||cfgLocal.alias||cfgLocal.cbu||'Consultar con local'}`;
 }else{pideSenaActiva=false; montoSenaAct=0; $('boxSena').classList.add('hidden'); $('inpComp').value='';}
}
async function generarSlotsUI(){
 let fecha=$('rFecha').value; let selS=$('rServicio'); let opt=selS.options[selS.selectedIndex];
 if(!fecha||!opt||!opt.value){$('slots').innerHTML='<span style="font-size:11px;opacity:.7">Elegi fecha y servicio</span>';return;}
 if(pausasFechasCache[fecha]){$('slots').innerHTML=`<span style="font-size:12px;background:#f59e0b22;border:1px solid #f59e0b55;padding:6px 10px;border-radius:10px">Pausado para ${fecha}</span>`; $('avisoBloqueo').classList.remove('hidden'); $('avisoBloqueo').textContent='Pausado para este dia '+fecha; return;}
 let diaSem = new Date(fecha+'T12:00:00').getDay();
 let mapaDias = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
 let nombreDia = mapaDias[diaSem];
 let diasCfg = cfgLocal.diasLaborales || cfgLocal.dias || cfgLocal.horarioDias;
 if(diasCfg && diasCfg[nombreDia]===false){$('slots').innerHTML=`<span style="font-size:12px;background:#ffffff11;padding:6px 10px;border-radius:10px">Cerrado los ${nombreDia}</span>`; return;}
 let dur=Number(opt.dataset.dur||30);
 let snap=await db.collection('reservas').where('localId','==',localElegidoId).where('fecha','==',fecha).get();
 let res=snap.docs.map(d=>d.data()).filter(r=>r.estado!=='cancelada');
 $('slots').innerHTML=''; let ap=cfgLocal.apertura||'09:00'; let ci=cfgLocal.cierre||'18:00'; let ac=toMin(ap); let fin=toMin(ci); let hay=false;
 while(ac+dur<=fin){
   let h=`${String(Math.floor(ac/60)).padStart(2,'0')}:${String(ac%60).padStart(2,'0')}`;
   let cfgH=horariosCache[h]||{}; let cupoMax=Number(cfgH.cupoMax||cfgLocal.cupoPorDefecto||1);
   if(cfgH.activo===false) cupoMax=0;
   let ocupadas=res.filter(r=>r.hora===h).length; let libres=cupoMax-ocupadas; let pausadoHora=cfgH.activo===false||cupoMax===0; let oc=libres<=0||pausadoHora;
   let b=document.createElement('button');
   b.style.cssText=`padding:10px 14px;border-radius:999px;border:1px solid #ffffff1e;background:${oc?'#00000022':'#ffffff12'};color:#fff;font-size:12px;cursor:${oc?'not-allowed':'pointer'};${oc?'opacity:.4':''}`;
   b.textContent=pausadoHora?`${h} pausado`:`${h} (${ocupadas}/${cupoMax})`;
   if(!oc){hay=true; b.onclick=()=>{horaElegida=h; document.querySelectorAll('#slots button').forEach(x=>{x.style.background='#ffffff12';x.style.color='#fff';}); b.style.background='#fff'; b.style.color='#3a0f6e'; $('slotInfo').textContent='Elegiste '+h;}; }
   $('slots').appendChild(b); ac+=dur;
 }
 if(!hay){$('slots').innerHTML='<span style="font-size:11px">Sin cupos libres o pausado este dia</span>';}
 let bloq=estaPausadoTotal(cfgLocal, fecha);
 $('avisoBloqueo').classList.toggle('hidden',!bloq &&!estaBloqueadoPorPago(cfgLocal));
 if(bloq){$('avisoBloqueo').textContent=bloq;}
}
</script>
<script>
$('btnReservar').onclick=async()=>{
 if(!localElegidoId||!horaElegida||!$('rFecha').value){toast('Elegi fecha y hora');return;}
 let opt=$('rServicio').options[$('rServicio').selectedIndex]; if(!opt){toast('Elegi servicio');return;}
 let dur=Number(opt.dataset.dur||30);
 if(cfgLocal.pideDni===true &&!$('inpDni').value.trim()){toast('DNI obligatorio');return;}
 if(pideSenaActiva &&!$('inpComp').value.trim()){toast('Carga comprobante');return;}
 if(estaBloqueadoPorPago(cfgLocal)){toast('Local bloqueado por pago');return;}
 let pausa = estaPausadoTotal(cfgLocal, $('rFecha').value); if(pausa){toast(pausa);return;}
 $('btnReservar').disabled=true; $('btnReservar').textContent='Reservando...';
  try{
   await db.runTransaction(async tx=>{
     let localRef=db.collection('config').doc(localElegidoId);
     let localSnap=await tx.get(localRef);
     if(!localSnap.exists) throw new Error('Local no existe');
     let lData=localSnap.data();
     if(lData.bloqueado===true) throw new Error('Local bloqueado');
     if(lData.planActivo===false) throw new Error('Local vencido');
     let v=getVenceDate(lData);
     if(v && (new Date()-v)/36e5 > (cfgAdm.horasPlan||48)) throw new Error('Plan vencido');
     if(lData.reservasPausadas===true) throw new Error('Pauso reservas');
     let pausaRef=db.collection('config').doc(localElegidoId).collection('pausasFechas').doc($('rFecha').value);
     let pausaSnap=await tx.get(pausaRef);
     if(pausaSnap.exists) throw new Error('Pausado para este dia');
     let horRef=db.collection('config').doc(localElegidoId).collection('horarios').doc(horaElegida);
     let horSnap=await tx.get(horRef);
     let cupoMax = Number((horSnap.exists?horSnap.data().cupoMax:null) || lData.cupoPorDefecto || 1);
     let activoHor = horSnap.exists? horSnap.data().activo!==false : true;
     if(!activoHor || cupoMax<=0) throw new Error('Horario pausado');
     let q = await db.collection('reservas').where('localId','==',localElegidoId).where('fecha','==',$('rFecha').value).where('hora','==',horaElegida).get();
     let activas = q.docs.map(d=>d.data()).filter(r=>r.estado!=='cancelada');
     if(activas.length >= cupoMax) throw new Error('Sin cupo '+activas.length+'/'+cupoMax);
     let reservaRef=db.collection('reservas').doc();
     tx.set(reservaRef,{
       localId:localElegidoId, uidLocal:localElegidoId, nombreLocal:lData.localNombre||lData.nombre||cfgLocal.localNombre,
       clienteUid:auth.currentUser.uid, cliente:auth.currentUser.email, clienteNombre:$('pNom').value||auth.currentUser.email,
       servicio:opt.value, fecha:$('rFecha').value, hora:horaElegida, fechaHora:$('rFecha').value+' '+horaElegida,
       duracion:dur, precio:Number(opt.dataset.pr||0),
       estado:pideSenaActiva?'pendiente_sena':'confirmada',
       senaMonto:pideSenaActiva?montoSenaAct:0, dni:$('inpDni').value.trim(), comprobante:$('inpComp').value.trim(),
       ts:Date.now(), creado:firebase.firestore.FieldValue.serverTimestamp()
     });
   });
   toast('Reserva OK'); cargarMisReservas(); generarSlotsUI(); goScreen('reservas');
 }catch(e){toast('Error: '+e.message);}finally{$('btnReservar').disabled=false; $('btnReservar').textContent='Confirmar reserva';}
};
function tsToNum(t){if(!t)return 0;if(t.toDate)return t.toDate().getTime();if(t.seconds)return t.seconds*1000;let d=new Date(t);return isNaN(d.getTime())?0:d.getTime();}
async function cargarMisReservas(){
 let snap=await db.collection('reservas').where('clienteUid','==',auth.currentUser.uid).get();
 let docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.estado!=='cancelada');
 docs.sort((a,b)=>tsToNum(b.ts||b.creado)-tsToNum(a.ts||a.creado)); docs=docs.slice(0,30); reservasCache=docs;
 $('listaReservas').innerHTML=docs.map(r=>{let col=r.estado==='pendiente_sena'?'#fde68a':'#fff'; return `<li style="display:flex;justify-content:space-between;padding:10px;border:1px solid #ffffff1e;border-radius:12px;background:#ffffff0f;margin-bottom:6px"><div><b style="font-size:13px">${r.servicio}</b><div style="font-size:11px;opacity:.7">${r.fecha} ${r.hora} - ${r.nombreLocal} - <b style="color:${col}">${r.estado}</b></div></div><div style="font-size:11px">$${r.precio||0}</div></li>`;}).join('')||'<li>Sin reservas</li>';
 cargarReservasEnSoporte();
}
function cargarReservasEnSoporte(){
 let sel=$('soporteReserva'); if(!sel) return; let localId=$('soporteLocal').value||localElegidoId;
 sel.innerHTML='<option value="">Sin reserva / consulta general</option>';
 reservasCache.filter(r=>{return!localId||r.localId===localId;}).forEach(r=>{let o=document.createElement('option');o.value=r.id;o.textContent=`${r.fecha} ${r.hora} - ${r.servicio} - ${r.estado}`;sel.appendChild(o);});
}
 async function cargarFavoritos(){
 if(!auth.currentUser)return; let snap=await db.collection('favoritos').where('clienteUid','==',auth.currentUser.uid).get(); favsCache=snap.docs.map(d=>d.data().localId);
 let lista=$('listaFavs');
 if(!favsCache.length){lista.innerHTML='<div style="font-size:12px;opacity:.7">Aun no tenes favoritos, toca Fav en un local</div>';return;}
 lista.innerHTML=favsCache.map(id=>{let L=localesCache.find(x=>x.id===id); if(!L)return ''; let foto=L.foto||galeriasCache[L.id]||`https://picsum.photos/seed/${L.id}/200`; return `<div style="display:flex;gap:10px;background:#ffffff10;border:1px solid #ffffff18;border-radius:14px;padding:8px;cursor:pointer" onclick="document.getElementById('rLocal').value='${L.id}';document.getElementById('rLocal').dispatchEvent(new Event('change'));goScreen('inicio')"><img src="${foto}" style="width:56px;height:56px;border-radius:10px;object-fit:cover"><div><b style="font-size:13px">${L.localNombre||L.nombre}</b><div style="font-size:11px;opacity:.7">${L.direccion||''}</div></div></div>`;}).join('');
}
function actualizarBotonFav(){let id=localElegidoId; let esFav=favsCache.includes(id); $('btnFav').textContent=esFav?'❤️ Fav':'🤍 Fav';}
$('btnFav').onclick=async()=>{
 if(!localElegidoId)return; let uid=auth.currentUser.uid; let q=await db.collection('favoritos').where('clienteUid','==',uid).where('localId','==',localElegidoId).get();
 if(!q.empty){await q.docs[0].ref.delete(); toast('Quitado de favs');}else{await db.collection('favoritos').add({clienteUid:uid,localId:localElegidoId,ts:Date.now()}); toast('Agregado a favs');}
 cargarFavoritos(); actualizarBotonFav();
};
function compressImage(file, maxW=400, quality=0.6){
 return new Promise((res,rej)=>{
   let img=new Image(); let r=new FileReader();
   r.onload=e=>{img.src=e.target.result;};
   r.onerror=rej; r.readAsDataURL(file);
   img.onload=()=>{
     let canvas=document.createElement('canvas'); let scale=Math.min(1, maxW/img.width);
     canvas.width=img.width*scale; canvas.height=img.height*scale;
     let ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
     res(canvas.toDataURL('image/jpeg',quality));
   };
   img.onerror=rej;
 });
}
$('perfilFotoFile').onchange=async e=>{
 let f=e.target.files[0]; if(!f)return;
 if(f.size>5000000){toast('Foto muy grande');return;}
 let base64=await compressImage(f,400,0.6);
 perfilFotoBase64=base64;
 $('perfilFotoBox').innerHTML=`<img src="${perfilFotoBase64}" style="width:100%;height:100%;object-fit:cover">`;
 $('avatarTop').innerHTML=`<img src="${perfilFotoBase64}">`;
};
$('btnSavePerf').onclick=async()=>{
 try{
   await db.collection('clientes').doc(auth.currentUser.uid).set({nombre:$('pNom').value.trim(),whatsapp:$('pWsp').value.trim().replace(/\D/g,''),direccion:$('pDir').value.trim(),foto:perfilFotoBase64||'',email:auth.currentUser.email},{merge:true});
   toast('Guardado'); $('saludo').innerHTML=`Hola, ${$('pNom').value.trim()}`; $('perfilNombre').textContent=$('pNom').value.trim();
   if(perfilFotoBase64){$('avatarTop').innerHTML=`<img src="${perfilFotoBase64}">`;}else{$('avatarTop').textContent=$('pNom').value.trim().slice(0,2).toUpperCase();}
 }catch(e){toast('Error al guardar');}
};
$('soporteFile').onchange=async e=>{
 let f=e.target.files[0]; if(!f) return;
 if(f.size>5000000){toast('Imagen max 5MB'); e.target.value='';return;}
 capturaSoporteBase64=await compressImage(f,600,0.6);
 $('soportePreview').innerHTML=`<img src="${capturaSoporteBase64}" style="max-width:180px;border-radius:10px;border:1px solid #fff3"><div style="font-size:10px;color:#86efac">Archivo listo ~${Math.round(capturaSoporteBase64.length/1024)}KB</div>`;
};
 $('btnSoportePerfil').onclick=async()=>{
 let localId=$('soporteLocal').value; let reservaId=$('soporteReserva').value; let fechaProb=$('soporteFecha').value; let horaProb=$('soporteHora').value; let msg=$('soporteMsg').value.trim();
 if(!localId){toast('Elegi local');return;} if(!fechaProb){toast('Elegi fecha');return;} if(!horaProb){toast('Elegi hora');return;} if(!msg){toast('Escribi que paso');return;}
 let L=localesCache.find(x=>x.id===localId)||cfgLocal||{};
 let cliDoc=await db.collection('clientes').doc(auth.currentUser.uid).get(); let cli=cliDoc.data()||{};
 let ahora=new Date(); let fechaEnv=ahora.toLocaleDateString('es-AR'); let horaEnv=ahora.toLocaleTimeString('es-AR');
 let datosRes=reservasCache.find(r=>r.id===reservaId)||null;
 await db.collection('soporte').add({
   origen:'cliente', uidCliente:auth.currentUser.uid, idCliente:auth.currentUser.uid,
   nombreCliente:cli.nombre||$('pNom').value||auth.currentUser.email, emailCliente:auth.currentUser.email,
   whatsappCliente:cli.whatsapp||$('pWsp').value||'', direccionCliente:cli.direccion||$('pDir').value||'',
   uidLocal:localId, idLocal:localId, localId:localId, nombreLocal:L.localNombre||L.nombre||'Local', direccionLocal:L.direccion||'', telLocal:L.tel||L.telefono||'',
   idReserva:reservaId||'', reservaId:reservaId||'', datosReservaCompleto:datosRes||null,
   fechaReserva:datosRes?datosRes.fecha:'', horaReserva:datosRes?datosRes.hora:'', estadoReserva:datosRes?datosRes.estado:'',
   fechaProblema:fechaProb, horaProblema:horaProb, fechaHoraProblema:fechaProb+' '+horaProb,
   fechaEnvio:fechaEnv, horaEnvio:horaEnv,
   mensaje:msg, imagen:capturaSoporteBase64||'', texto:msg, leido:false,
   ts:Date.now(), creado:firebase.firestore.FieldValue.serverTimestamp()
 });
 $('soporteMsg').value=''; $('soporteFile').value=''; $('soporteReserva').value=''; $('soportePreview').innerHTML=''; capturaSoporteBase64=''; toast('Soporte enviado');
};
(()=>{let t=new Date(); t.setDate(t.getDate()+1); let f=$('rFecha'); if(f){f.valueAsDate=t;} let fs=$('soporteFecha'); if(fs){fs.valueAsDate=new Date();} let hs=$('soporteHora'); if(hs){hs.value=new Date().toTimeString().slice(0,5);}})();
</script>
