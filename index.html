<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reservAR - tu lugar, tu momento</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{ --violeta:#6a11cb; --rosa:#a78bfa; --card:#1f0736; --text:#ffffff; --mute:#cfc9e6; --stroke:#ffffff26; }
*{box-sizing:border-box; font-family:'Inter',sans-serif} 
html,body{height:100%}
body{margin:0; color:var(--text); background: linear-gradient(160deg, var(--violeta), #7b1fa2 40%, #3a0f6e 70%, #0a0933); min-height:100vh; background-attachment:fixed;}
.hidden{display:none!important}
.header-reservar{position:absolute; top:14px; left:16px; z-index:5}
.header-reservar h1{margin:0; font-size:18px; font-weight:800; color:white}
.header-reservar span{font-weight:300; font-size:14px; margin-left:5px; color:var(--mute)}

.auth{max-width:460px; margin:72px auto 0; background:#ffffff12; border:1px solid var(--stroke); border-radius:14px; padding:16px; backdrop-filter: blur(10px)}
.auth h2{color:white; font-size:22px; font-weight:700; margin:0 0 12px 0}
.auth input{width:100%; margin-top:12px; background:#ffffff08; border:1px solid #ffffff22; border-radius:10px; padding:.7rem; color:#fff; font:inherit; outline:none}
.btn{background:#b794f6; border:none; color:#fff; padding:.7rem .9rem; border-radius:10px; cursor:pointer; font:inherit; font-weight:700}
.btn.full{width:100%; margin-top:18px}
.btn.ghost{width:100%; background:transparent; border:1px solid var(--stroke); font-weight:600; font-size:13px; margin-top:8px}
.btn.link{background:transparent; border:none; color:var(--mute); text-decoration:underline; font-size:13px; width:100%; margin-top:10px}
.note{color:#ffdddd; font-size:14px; min-height:1.2em; margin-top:12px}
</style>
</style>
</head>
<body class="min-h-screen">

<div id="pantalla-login" class="min-h-screen flex flex-col p-0">
  <div class="header-reservar"><h1>reservAR <span>tu lugar, tu momento.</span></h1></div>
  <div class="flex-1 flex justify-center px-5 pb-10">
    <!-- LOGIN ORIGINAL QUE ME PASASTE -->
    <section id="auth" class="auth">
      <h2>Ingresá</h2>
      <input id="lEmail" placeholder="Email">
      <input id="lPass" type="password" placeholder="Contraseña">
      <button onclick="login()" class="btn full">Entrar</button>
      <button onclick="show('registro')" class="btn ghost full">Crear cuenta</button>
      <button onclick="recuperar()" class="btn link">¿Olvidaste tu contraseña?</button>
      <p id="lError" class="note hidden"></p>
    </section>
  </div>
</div>

<div id="pantalla-registro" class="hidden min-h-screen flex items-center justify-center p-5">
  <section id="register" class="auth">
    <h2>Crear cuenta</h2>
    <input id="rNombre" placeholder="Nombre">
    <input id="rEmail" placeholder="Email ej: jona@gmail.com">
    <input id="rPass" type="password" placeholder="Contraseña 6+ caracteres">
    <input id="rPass2" type="password" placeholder="Repetir contraseña">
    <button onclick="registro()" class="btn full">Crear</button>
    <button onclick="show('login')" class="btn ghost full">Ya tengo cuenta</button>
    <p id="rError" class="note hidden"></p>
  </section>
</div>
<div id="pantalla-app" class="hidden min-h-screen bg-[#13052a] text-white">
  <header class="sticky top-0 z-20 bg-[#1a0a35] border-b border-white/5">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="font-extrabold text-xl">reserv<span class="text-violet-400">AR</span></h1>
      <div class="flex gap-2">
        <button onclick="tab('ajustes')" class="text-xs bg-white/10 px-3 py-1.5 rounded-full">Perfil</button>
        <button onclick="logout()" class="text-xs bg-white text-[#13052a] font-bold px-3 py-1.5 rounded-full">Cerrar sesión</button>
      </div>
    </div>
    <div class="max-w-5xl mx-auto px-2 flex gap-2 overflow-x-auto py-2 text-[13px]" style="scrollbar-width:none">
      <button onclick="tab('inicio')" id="t-inicio" class="tab px-4 py-2 rounded-full bg-white text-[#13052a] font-bold">Inicio</button>
      <button onclick="tab('reservas')" id="t-reservas" class="tab px-4 py-2 rounded-full bg-white/10">Reservas</button>
      <button onclick="tab('calendario')" id="t-calendario" class="tab px-4 py-2 rounded-full bg-white/10">Calendario</button>
      <button onclick="tab('clientes')" id="t-clientes" class="tab px-4 py-2 rounded-full bg-white/10">Clientes</button>
      <button onclick="tab('servicios')" id="t-servicios" class="tab px-4 py-2 rounded-full bg-white/10">Servicios</button>
      <button onclick="tab('ajustes')" id="t-ajustes" class="tab px-4 py-2 rounded-full bg-white/10">Ajustes</button>
    </div>
  </header>
  <main class="max-w-5xl mx-auto p-4">
    <div id="sec-inicio">
      <div class="mt-3 bg-[#1e1040] border border-white/10 rounded-2xl p-4">
        <p class="text-[11px] text-violet-300 font-bold">RESERVAR TU LUGAR, TU MOMENTO</p>
        <div class="flex items-center gap-3 mt-3">
          <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center font-bold">✓</div>
          <div><p class="font-semibold" id="holaNombre">Hola Jona</p><p class="text-xs text-white/50">Bienvenido</p></div>
          <div class="ml-auto"><span id="pillEstado" class="text-[11px] px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Online</span></div>
        </div>
      </div>
      <div id="listaHoy" class="mt-4 text-sm text-white/60">No hay turnos hoy</div>
    </div>
    <div id="sec-reservas" class="hidden">
      <h2 class="font-bold text-lg">Nueva Reserva</h2>
      <div class="mt-3 bg-[#1e1040] border border-white/10 rounded-2xl p-5">
        <input id="resCliente" placeholder="Nombre cliente" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm">
        <input id="resWhatsapp" placeholder="WhatsApp" class="w-full mt-2 bg-white/5 border border-white/10 rounded-xl p-3 text-sm">
        <input id="resFecha" type="datetime-local" class="w-full mt-2 bg-white/5 border border-white/10 rounded-xl p-3 text-sm">
        <p id="avisoHorario" class="text-[11px] text-amber-300 mt-2 hidden"></p>
        <div id="boxDNI" class="hidden mt-3 bg-amber-500/10 border border-amber-500/20 rounded-xl p-3">
          <p class="text-xs font-bold text-amber-200">Este local pide DNI</p>
          <input id="resDNI" placeholder="Número DNI" class="w-full mt-2 bg-white/5 border rounded-xl p-3 text-sm">
        </div>
        <button onclick="guardarReserva()" class="w-full mt-4 bg-violet-600 py-3 rounded-xl font-bold">Guardar Reserva</button>
      </div>
      <div id="listaReservas" class="mt-4 space-y-2"></div>
    </div>
    <div id="sec-calendario" class="hidden"><h2 class="font-bold">Calendario</h2><div id="calGrid" class="mt-4 text-sm text-white/50">Calendario acá</div></div>
    <div id="sec-clientes" class="hidden"><h2 class="font-bold">Clientes</h2><div id="listaClientes" class="mt-3 text-sm text-white/50">Lista clientes</div></div>
    <div id="sec-servicios" class="hidden"><h2 class="font-bold">Servicios</h2><p class="text-sm text-white/50 mt-2">Corte, Color, etc.</p></div>
    <div id="sec-ajustes" class="hidden">
      <h2 class="font-bold">Ajustes</h2>
      <div class="mt-3 bg-[#1e1040] border border-white/10 rounded-2xl p-5 space-y-3">
        <div><label class="text-xs text-white/60">Apertura</label><input id="cfgApertura" type="time" value="09:00" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm"></div>
        <div><label class="text-xs text-white/60">Cierre</label><input id="cfgCierre" type="time" value="19:00" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm"></div>
        <div class="flex justify-between bg-white/5 p-3 rounded-xl"><span class="text-sm">¿Pedir DNI?</span><input id="cfgPideDNI" type="checkbox" onchange="toggleDNICheck()"></div>
        <button onclick="guardarCfg()" class="w-full bg-white text-black font-bold py-2 rounded-xl">Guardar Ajustes</button>
      </div>
    </div>
  </main>
</div>
<script>
const firebaseConfig={
  apiKey: "AIzaSyA-PEGÁ-TU-CLAVE-REAL-ACÁ",
  authDomain: "reservar-cb70d.firebaseapp.com",
  projectId: "reservar-cb70d",
  storageBucket: "reservar-cb70d.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let cfg={apertura:"09:00",cierre:"19:00",pideDNI:false};
function show(p){
  document.getElementById('pantalla-login').classList.add('hidden');
  document.getElementById('pantalla-registro').classList.add('hidden');
  document.getElementById('pantalla-app').classList.add('hidden');
  document.getElementById('pantalla-'+p).classList.remove('hidden');
}
function tab(t){
  document.querySelectorAll('[id^=sec-]').forEach(e=>e.classList.add('hidden'));
  document.getElementById('sec-'+t).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(e=>{e.className='tab px-4 py-2 rounded-full bg-white/10'});
  document.getElementById('t-'+t).className='tab px-4 py-2 rounded-full bg-white text-[#13052a] font-bold';
}
function toggleDNICheck(){
  const box=document.getElementById('boxDNI');
  if(box) box.classList.toggle('hidden',!document.getElementById('cfgPideDNI').checked)
}
function guardarCfg(){
  cfg.apertura=document.getElementById('cfgApertura').value;
  cfg.cierre=document.getElementById('cfgCierre').value;
  cfg.pideDNI=document.getElementById('cfgPideDNI').checked;
  localStorage.setItem('cfg',JSON.stringify(cfg));
  alert('Guardado');
}
function login(){
  const e=document.getElementById('lEmail').value,p=document.getElementById('lPass').value;
  auth.signInWithEmailAndPassword(e,p).then(()=>{show('app');tab('inicio')}).catch(er=>{
    let m=document.getElementById('lError');m.textContent=er.message;m.classList.remove('hidden')
  })
}
function registro(){
  const e=document.getElementById('rEmail').value,p=document.getElementById('rPass').value;
  auth.createUserWithEmailAndPassword(e,p).then(()=>{show('app')}).catch(er=>{
    let m=document.getElementById('rError');m.textContent=er.message;m.classList.remove('hidden')
  })
}
function logout(){auth.signOut().then(()=>show('login'))}
function recuperar(){
  const e=document.getElementById('lEmail').value;
  if(!e)return alert('Poné tu email');
  auth.sendPasswordResetEmail(e).then(()=>alert('Te enviamos el mail'))
}
function guardarReserva(){
  const cli=document.getElementById('resCliente').value,fecha=document.getElementById('resFecha').value;
  if(!cli||!fecha)return alert('Faltan datos');
  const hora=fecha.split('T')[1];
  if(hora<cfg.apertura||hora>cfg.cierre){
    document.getElementById('avisoHorario').textContent='Fuera de horario ('+cfg.apertura+' - '+cfg.cierre+')';
    document.getElementById('avisoHorario').classList.remove('hidden');return
  }
  db.collection('reservas').add({
    cliente:cli,whatsapp:document.getElementById('resWhatsapp').value,
    fecha,hora,dni:document.getElementById('resDNI')?.value||'',
    created:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{alert('Reserva guardada');document.getElementById('resCliente').value='';})
}
auth.onAuthStateChanged(u=>{
  if(u){show('app');tab('inicio');document.getElementById('holaNombre').textContent='Hola '+(u.displayName||u.email.split('@')[0]);}
  else show('login')
});
const saved=localStorage.getItem('cfg');
if(saved){try{
  cfg=JSON.parse(saved);
  document.getElementById('cfgApertura').value=cfg.apertura;
  document.getElementById('cfgCierre').value=cfg.cierre;
  document.getElementById('cfgPideDNI').checked=cfg.pideDNI;
}catch(e){}}
</script>
</body>
</html>
